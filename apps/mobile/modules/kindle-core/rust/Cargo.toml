[package]
name = "kindle-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "EPUB -> Kindle AZW3 (EBOK) + device thumbnail, for the Expo app via uniffi-bindgen-react-native"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
# Pinned: kindling has frequent breaking releases; check build_mobi_from_extracted's signature on bumps.
kindling-mobi = "=0.45.6"
uniffi = "0.31"
thiserror = "2"
futures-channel = "0.3"
# Web articles: Readability's extraction, the page and its images over rustls, and any image
# format re-encoded as the JPEG the Kindle reads. `image` matches kindling's, with its formats.
dom_smoothie = "0.20"
dom_query = "0.30"
ureq = "3.5"
url = "2"
image = "0.25.10"

[dev-dependencies]
pollster = "0.4"
# Same version kindling uses, to build fixture EPUBs in tests.
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
# Not `true`: ubrn reads the UNIFFI_META symbols from the library to generate bindings.
strip = "debuginfo"
